name: Forum backend and frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, fileinfo, mbstring, gd, zlib
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SHA-256, worker, translation and Markdown tests
        run: npm test
      - name: Install browser tests
        if: matrix.php == '8.5'
        run: |
          npm ci
          npm run vendor:ruffle
          git diff --exit-code -- public/vendor/ruffle
          npm run build:markdown
          git diff --exit-code -- public/markdown.js
          npx playwright-core install --with-deps chromium
      - name: Syntax check
        run: find src public bin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: HTTP integration tests
        env:
          FORBIRDS_BROWSER: ${{ matrix.php == '8.5' && '1' || '0' }}
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/forbirds-tests.log"
      - name: Report test failure details
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'forbirds-tests.log'
          if log.exists():
              text = log.read_text(errors='replace')
              marker = '\n======================================================================'
              start = text.find(marker)
              details = text[start:] if start >= 0 else text[-14000:]
              details = details[-28000:]
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Integration test failure details\n\n```text\n' + details + '\n```\n')
              escaped = details.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Integration test failures::' + escaped)
          PYTHON
