name: Forum backend and frontend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, fileinfo, mbstring, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SHA-256, worker and translation tests
        run: npm test
      - name: Install browser tests
        if: matrix.php == '8.5'
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Syntax check
        run: find src public bin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: HTTP integration tests
        env:
          FORBIRDS_BROWSER: ${{ matrix.php == '8.5' && '1' || '0' }}
        run: python3 -m unittest discover -s tests -v
