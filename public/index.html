<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ForBirds — форум">ForBirds — форум</title>
  <link rel="stylesheet" href="/general.css">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body data-page="index">
  <header>
    <div class="sub">
    <nav class="site-nav" aria-label="Навигация" data-i18n-aria-label="Навигация">
      <a href="/"><span data-i18n="Главная">Главная</span></a> <a href="/index.html?view=all"><span data-i18n="Все темы">Все темы</span></a>
      <a href="/dashboard.html"><span data-i18n="Создать тему">Создать тему</span></a> <a href="/profile.html" id="profile-link" hidden><span data-i18n="Моя страница">Моя страница</span></a> <a href="/dashboard.html?mode=mine" id="my-link" hidden><span data-i18n="Мои сообщения">Мои сообщения</span></a>
      <a href="/dashboard.html?mode=queue" id="queue-link" hidden><span data-i18n="Модерация">Модерация</span></a>
    </nav>
      <button id="language-switch" type="button" hidden></button>
      <form id="auth-form" action="/api/auth/login" method="post">
        <span data-i18n="Вход">Вход</span> <input aria-label="Имя пользователя" placeholder="имя пользователя" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" data-i18n-aria-label="Имя пользователя" data-i18n-placeholder="имя пользователя">
        <input aria-label="Пароль" placeholder="пароль" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="72" data-i18n-aria-label="Пароль" data-i18n-placeholder="пароль">
        <button name="action" value="login"><span data-i18n="Войти">Войти</span></button>
        <button name="action" value="register"><span data-i18n="Регистрация">Регистрация</span></button>
      </form>
      <div id="account" hidden><span id="account-name"></span> <button id="logout" type="button"><span data-i18n="Выйти">Выйти</span></button></div>
    </div>
    <div class="banner"><a class="banner-placeholder" href="/" aria-label="На главную" data-i18n-aria-label="На главную">banner placeholder</a></div>

    <div class="title"><span data-i18n="Поиск">Поиск</span></div>
    <form id="search-form" action="/index.html" method="get">
      <input aria-label="Поиск по форуму" name="q" type="search" required minlength="2" maxlength="200" data-i18n-aria-label="Поиск по форуму">
      <button><span data-i18n="Искать">Искать</span></button>
    </form>
    <div class="title"><span data-i18n="Обновления">Обновления</span></div>
    <table class="table news-table"><tbody id="news"><tr><td><span data-i18n="Загрузка новостей…">Загрузка новостей…</span></td></tr></tbody></table>
  </header>
  <p id="notice" role="status" aria-live="polite" hidden></p>
  <noscript><p>Для форм и локальной хэш-капчи необходим JavaScript. Вычисления выполняются только после нажатия кнопки проверки. JavaScript is required for forms and the local hash check.</p></noscript>
  <div class="title" id="page-title"><span data-i18n="Главная">Главная</span></div>
  <table class="main-layout"><tbody><tr>
    <td class="sidebar">
      <nav class="sidebar-scroll" id="sections" aria-label="Разделы" data-i18n-aria-label="Разделы"><span data-i18n="Загрузка разделов…">Загрузка разделов…</span></nav></td>
    <td class="main-content">
      <hr>
      <div class="scroll">

      <p id="feed-description"></p>
      <div id="feed" aria-live="polite"><span data-i18n="Загрузка тем…">Загрузка тем…</span></div>
      <nav id="pagination" class="pagination" aria-label="Страницы" data-i18n-aria-label="Страницы"></nav>

      </div>
    </td>
  </tr></tbody></table>
  <footer>
    <div class="title"><span data-i18n="Информация">Информация</span></div>
    <table class="footer-table"><tbody><tr>
      <td><hr></td><td>ForBirds Software 1.0</td><td><hr></td>
    </tr></tbody></table>
  </footer>
</body>
</html>
